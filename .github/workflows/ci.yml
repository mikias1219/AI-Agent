name: CI / CD

# PRs: backend + frontend checks
# Push to main / workflow_dispatch: migrate Supabase → sync Render → deploy Render → deploy Vercel
#
# GitHub Environment "production" secrets:
#   DATABASE_URL, DASHBOARD_SECRET_KEY, FRONTEND_ORIGIN
#   TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_CHAT_IDS
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI (optional)
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   RENDER_API_KEY, RENDER_SERVICE_ID
# Optional: VITE_API_BASE_URL (leave empty — Vercel /api proxy is same-origin)
# Optional repo secrets for keep-supabase-awake.yml: DATABASE_URL (or SUPABASE_*)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend · ruff · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  frontend:
    name: Frontend · format · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - name: Build (empty API base = relative /api for artifact smoke)
        env:
          VITE_API_BASE_URL: ""
        run: npm run build
      - name: No privileged secrets in the bundle
        run: |
          if grep -rEI "service_role|SERVICE_ROLE|sbp_|sk-or-|rnd_|vcp_|eyJhbGci" dist/; then
            echo "::error::Privileged secret leaked into frontend/dist/"
            exit 1
          fi

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DASHBOARD_SECRET_KEY: ${{ secrets.DASHBOARD_SECRET_KEY }}
      FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Report secret coverage
        run: |
          {
            echo "## Deploy secret coverage"
            echo "| Secret | Status |"
            echo "| --- | --- |"
            for v in DATABASE_URL DASHBOARD_SECRET_KEY FRONTEND_ORIGIN \
              TELEGRAM_BOT_TOKEN TELEGRAM_ALLOWED_CHAT_IDS \
              GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URI \
              VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID \
              RENDER_API_KEY RENDER_SERVICE_ID; do
              if [ -n "${!v}" ]; then echo "| \`$v\` | ready |"; else echo "| \`$v\` | **missing** |"; fi
            done
            if [ -n "${VITE_API_BASE_URL}" ]; then
              echo "| \`VITE_API_BASE_URL\` | ready (direct API) |"
            else
              echo "| \`VITE_API_BASE_URL\` | empty (Vercel /api proxy) |"
            fi
            echo ""
            echo "Render control plane uses \`PERSONAL_AGENT_PROVIDER=fake\` (local Ollama only for real inference)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Apply Alembic migrations
        if: ${{ env.DATABASE_URL != '' }}
        working-directory: backend
        run: |
          python -m pip install -e .
          alembic upgrade head

      - name: Skip migrations
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "::warning::DATABASE_URL missing — skipped Alembic migrations."

      - name: Sync Render env vars and deploy
        if: ${{ env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != '' }}
        run: bash scripts/deploy-render.sh

      - name: Skip Render deploy
        if: ${{ env.RENDER_API_KEY == '' || env.RENDER_SERVICE_ID == '' }}
        run: echo "::warning::RENDER_API_KEY / RENDER_SERVICE_ID missing — Render deploy skipped."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Deploy frontend to Vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: |
          npm --prefix frontend ci
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel env rm VITE_API_BASE_URL production --yes --token="$VERCEL_TOKEN" || true
          vercel env rm VITE_API_BASE_URL preview --yes --token="$VERCEL_TOKEN" || true
          vercel env rm VITE_API_BASE_URL development --yes --token="$VERCEL_TOKEN" || true
          find frontend .vercel -maxdepth 2 -name '.env*' 2>/dev/null | while read -r f; do
            sed -i '/^VITE_API_BASE_URL=/d' "$f" || true
          done
          printf 'VITE_API_BASE_URL=\n' > frontend/.env.production.local
          vercel build --prod --token="$VERCEL_TOKEN"
          if grep -R "onrender.com" frontend/.vercel/output/static/assets/*.js 2>/dev/null \
            || grep -R "onrender.com" .vercel/output/static/assets/*.js 2>/dev/null; then
            echo "::error::Frontend bundle still embeds a Render API origin; same-origin /api required."
            exit 1
          fi
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed frontend: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip Vercel deploy
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        run: echo "::warning::Vercel secrets missing — web deploy skipped."

      - name: Smoke Render health
        if: ${{ env.RENDER_SERVICE_ID != '' }}
        run: |
          # Best-effort: known production host from vercel.json rewrite target.
          for url in \
            "https://personal-agent-api-gy14.onrender.com/api/health" \
            ; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$url" || true)
            echo "GET $url → $code"
            cat /tmp/health.json || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Health check" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$url\` → **$code**" >> "$GITHUB_STEP_SUMMARY"
          done
