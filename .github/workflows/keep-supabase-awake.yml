# Keeps the production Supabase Postgres project awake on the free plan.
# Needs repository or Environment secret DATABASE_URL (pooler connection string).

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: SELECT 1 against DATABASE_URL
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Add DATABASE_URL repository secret (Supabase pooler URL)."
            exit 1
          fi
          python -m pip install -q "psycopg[binary]>=3.1"
          python - <<'PY'
          import os, sys
          import psycopg
          url = os.environ["DATABASE_URL"].strip()
          if url.startswith("postgres://"):
              url = "postgresql://" + url[len("postgres://"):]
          for attempt in range(1, 13):
              try:
                  with psycopg.connect(url, connect_timeout=20) as conn:
                      with conn.cursor() as cur:
                          cur.execute("SELECT 1")
                          cur.fetchone()
                  print(f"Attempt {attempt}: ok")
                  sys.exit(0)
              except Exception as exc:
                  print(f"Attempt {attempt}: {exc}")
                  import time
                  time.sleep(30)
          sys.exit(1)
          PY
