# Blueprint for the AURA / Personal AI Agent API on Render.
# Secrets are injected from GitHub Actions (Environment production), not committed here.
# Inference is local-only (Ollama on the Ubuntu machine). Render is the control plane;
# do not configure paid cloud model APIs. Full local worker offload is Phase 3.
services:
  - type: web
    name: personal-agent-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Cloud dyno cannot reach your laptop Ollama; use fake until Phase 3 worker exists,
      # or keep ollama only for local/dev. Prefer not running Hermes inference on Render.
      - key: PERSONAL_AGENT_PROVIDER
        value: fake
      - key: HERMES_DIRECTORY
        value: /app/backend/data/hermes
      - key: LOG_LEVEL
        value: INFO
      # Set via Render dashboard or GitHub Actions upsert:
      # DATABASE_URL, DASHBOARD_SECRET_KEY, FRONTEND_ORIGIN,
      # TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_CHAT_IDS
