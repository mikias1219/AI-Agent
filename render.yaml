# Blueprint for the AURA Personal AI Agent API on Render.
# Secrets are injected from GitHub Actions (Environment production), not committed here.
# Production inference: PERSONAL_AGENT_PROVIDER=openai via free Groq/OpenRouter keys
# (HERMES_* or OPENAI_COMPAT_*). deploy-render.sh upserts the live provider.
services:
  - type: web
    name: personal-agent-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Prefer openai when HERMES_API_KEY / OPENAI_COMPAT_* is synced by CI.
      # Settings also auto-upgrades fake→openai in production when a key is present.
      - key: PERSONAL_AGENT_PROVIDER
        value: openai
      - key: HERMES_DIRECTORY
        value: /app/backend/data/hermes
      - key: LOG_LEVEL
        value: INFO
      # Set via Render dashboard or GitHub Actions upsert:
      # DATABASE_URL, DASHBOARD_SECRET_KEY, FRONTEND_ORIGIN,
      # HERMES_API_KEY, HERMES_BASE_URL, HERMES_MODEL,
      # OPENAI_COMPAT_API_KEY, OPENAI_COMPAT_BASE_URL, OPENAI_COMPAT_MODEL,
      # TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_CHAT_IDS,
      # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI
