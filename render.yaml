# Blueprint for the AURA Personal Agent Hub API on Render.
# Secrets are injected from GitHub Actions (Environment production), not committed here.
# Inference is local-only (Ollama on your machine). Render is the control plane;
# do not configure paid cloud model APIs.
services:
  - type: web
    name: personal-agent-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Cloud dyno cannot reach laptop Ollama; fake keeps the API/hub/Telegram control plane up.
      - key: PERSONAL_AGENT_PROVIDER
        value: fake
      - key: HERMES_DIRECTORY
        value: /app/backend/data/hermes
      - key: LOG_LEVEL
        value: INFO
      # Set via Render dashboard or GitHub Actions upsert:
      # DATABASE_URL, DASHBOARD_SECRET_KEY, FRONTEND_ORIGIN,
      # TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_CHAT_IDS,
      # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI
