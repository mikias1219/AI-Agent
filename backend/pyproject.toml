[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-agent"
version = "0.1.0"
description = "Personal AI agent: modular monolith, Ollama-powered, CLI-first, integration-ready."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "jsonschema>=4.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-jsonschema>=4.22",
]

[project.scripts]
personal-agent = "personal_agent.presentation.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["personal_agent", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-r a"

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "personal_agent"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain does not import outer layers"
type = "forbidden"
source_modules = ["personal_agent.domain"]
forbidden_modules = [
    "personal_agent.infrastructure",
    "personal_agent.application",
    "personal_agent.presentation",
    "personal_agent.app",
]

[[tool.importlinter.contracts]]
name = "Domain does not import frameworks or I/O libraries"
type = "forbidden"
source_modules = ["personal_agent.domain"]
forbidden_modules = ["sqlalchemy", "fastapi", "httpx", "typer", "psycopg", "uvicorn", "alembic"]
