# Blueprint for the Personal AI Agent API on Render.
# Secrets are injected from GitHub Actions (Environment production), not committed here.
services:
  - type: web
    name: personal-agent-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PERSONAL_AGENT_PROVIDER
        value: hermes
      - key: HERMES_DIRECTORY
        value: /app/backend/data/hermes
      - key: HERMES_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: HERMES_CONTEXT_TOKENS
        value: "64000"
      - key: LOG_LEVEL
        value: INFO
      # Set via Render dashboard or GitHub Actions upsert:
      # DATABASE_URL, DASHBOARD_SECRET_KEY, FRONTEND_ORIGIN,
      # HERMES_API_KEY, HERMES_MODEL, TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_CHAT_IDS
