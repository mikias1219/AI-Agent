# Manual live-model evaluation (OBS-03). Offline scripted evals run in ci.yml.
# Optional secret: OPENAI_COMPAT_API_KEY (and OPENAI_COMPAT_*). Do not compare
# secrets in `if:` — GitHub blocks that and fails the workflow file.

name: Evals · live model

on:
  workflow_dispatch:

jobs:
  live-evals:
    name: Live model scenarios
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Run scripted evals (always)
        run: python -m pytest tests/evaluation -q
      - name: Note on live provider
        env:
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
        run: |
          if [ -z "${OPENAI_COMPAT_API_KEY}" ]; then
            echo "No OPENAI_COMPAT_API_KEY; live provider suite skipped."
          else
            echo "Live provider key present; scripted scenarios remain the CI gate."
            PERSONAL_AGENT_PROVIDER=openai python -m pytest tests/evaluation -q
          fi
