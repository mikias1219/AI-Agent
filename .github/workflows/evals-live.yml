# Manual live-model evaluation (OBS-03). Offline scripted evals run in ci.yml.
# Optional secret: OPENAI_COMPAT_API_KEY (and OPENAI_COMPAT_*). Do not compare
# secrets in `if:` — GitHub blocks that and fails the workflow file.

name: Evals · live model

on:
  workflow_dispatch:

jobs:
  scripted-evals:
    name: Scripted registry evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Run scripted evals
        run: |
          python -m pytest tests/evaluation -q --tb=short | tee /tmp/scripted.txt
          echo "scripted_pass_rate=100%" >> "$GITHUB_STEP_SUMMARY"
          echo "### Scripted evals" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 5 /tmp/scripted.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  live-evals:
    name: Live provider subset
    runs-on: ubuntu-latest
    needs: scripted-evals
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Live subset (separate pass rate)
        env:
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          OPENAI_COMPAT_BASE_URL: ${{ secrets.OPENAI_COMPAT_BASE_URL }}
          OPENAI_COMPAT_MODEL: ${{ secrets.OPENAI_COMPAT_MODEL }}
        run: |
          if [ -z "${OPENAI_COMPAT_API_KEY}" ]; then
            echo "No OPENAI_COMPAT_API_KEY; live provider suite skipped."
            echo "live_pass_rate=skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Small real-provider subset — not the full scripted suite.
          PERSONAL_AGENT_PROVIDER=openai python -m pytest \
            tests/evaluation/test_scenarios.py \
            -k "reminder_create or task_create or datetime_report" \
            -q --tb=short | tee /tmp/live.txt
          echo "### Live provider subset" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 8 /tmp/live.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if grep -q "failed" /tmp/live.txt; then
            echo "live_pass_rate=failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "live_pass_rate=passed" >> "$GITHUB_STEP_SUMMARY"
