# Manual live-model evaluation (OBS-03). Offline scripted evals run in ci.yml.
# Set repository secret OPENAI_COMPAT_API_KEY (and optional OPENAI_COMPAT_*) to enable.

name: Evals · live model

on:
  workflow_dispatch:

jobs:
  live-evals:
    name: Live model scenarios
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Run scripted evals (always)
        run: python -m pytest tests/evaluation -q
      - name: Skip live provider unless secret is set
        if: ${{ secrets.OPENAI_COMPAT_API_KEY == '' }}
        run: echo "No OPENAI_COMPAT_API_KEY; live provider suite skipped."
      - name: Live provider smoke (placeholder)
        if: ${{ secrets.OPENAI_COMPAT_API_KEY != '' }}
        env:
          PERSONAL_AGENT_PROVIDER: openai
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          OPENAI_COMPAT_BASE_URL: ${{ secrets.OPENAI_COMPAT_BASE_URL }}
          OPENAI_COMPAT_MODEL: ${{ secrets.OPENAI_COMPAT_MODEL }}
        run: |
          echo "Live provider configured; scripted scenarios remain the CI gate."
          python -m pytest tests/evaluation -q
